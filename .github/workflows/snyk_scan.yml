name: Snyk Security Scan

on:
  push:
    branches:
      - master
      - release/**
      - security/**
  pull_request:
    branches:
      - master
      - release/**
      - security/**

permissions:
  id-token: write
  contents: write

jobs:
  snyk:
    uses: IPSI-AU/es-devops/.github/workflows/snyk-reusable.yml@master
    secrets: inherit
